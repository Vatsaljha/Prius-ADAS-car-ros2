slam_toolbox:
  ros__parameters:
    use_sim_time: true

    map_frame: map
    odom_frame: odom
    base_frame: base_link

    scan_topic: /prius/scan
    min_laser_range: 0.21
    max_laser_range: 20.0

    # Saved-map localization
    mode: localization
    map_file_name: /home/vatsal/prius_adas_ws/prius_maps/prius_figure8
    # This parameter is not supported for localization mode on the current
    # setup; keep it disabled.
    map_start_at_dock: false
    resolution: 0.05

    map_update_interval: 5.0

    # TF
    transform_publish_period: 0.05
    restamp_tf: false
    transform_timeout: 0.75
    tf_buffer_duration: 30.0

    # LiDAR is about 25 Hz on this simulation. Process every second scan.
    throttle_scans: 2
    scan_queue_size: 1

    # Localization must update often enough for Nav2 to follow a moving car.
    minimum_time_interval: 0.10
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10

    # Scan matching
    use_scan_matching: true
    use_scan_barycenter: true
    correlation_search_space_dimension: 0.40
    correlation_search_space_resolution: 0.02
    correlation_search_space_smear_deviation: 0.10

    # Scan linking
    link_scan_maximum_distance: 1.5
    link_match_minimum_response_fine: 0.10

    # Saved pose graph is already available. Keep loop closure off here to
    # reduce CPU load during localization.
    do_loop_closing: false
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    debug_logging: false
    enable_interactive_mode: false
